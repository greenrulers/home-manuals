<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>我家家電說明書</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
:root{
  --bg:#f6f7f5; --card:#fff; --ink:#1c1f1e; --muted:#5d6663; --line:#dfe4e1;
  --accent:#0f766e; --accent-soft:#e3f2ef; --warn:#b45309; --warn-soft:#fdf3e4;
  --danger:#b42318; --danger-soft:#fdecea; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121514; --card:#1b1f1e; --ink:#e8ecea; --muted:#9aa5a1; --line:#2c3331;
    --accent:#5eead4; --accent-soft:#16302c; --warn:#fbbf24; --warn-soft:#2e2511;
    --danger:#fca5a5; --danger-soft:#351a1a; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px calc(10px) ;padding-top:max(10px,env(safe-area-inset-top))}
.top-row{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.brand{font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.search{flex:1;position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:10px 38px 10px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;display:none}
main{max-width:960px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:26px;line-height:1.35;margin:4px 0 6px}
h2{font-size:21px;margin:30px 0 10px;padding-top:8px;scroll-margin-top:120px}
h3{font-size:18px;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.chip.on{color:#0b1715}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--accent)}
.card .ic{font-size:30px;line-height:1}
.card .nm{font-weight:700;font-size:18px;margin-top:6px}
.card .md{color:var(--muted);font-size:14px;word-break:break-all}
.card .ct{margin-top:6px;font-size:13px;color:var(--accent)}
.cat-title{font-size:17px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.hit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px}
.hit .hh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;text-decoration:none;color:var(--ink)}
.hit ul{margin:6px 0 0;padding-left:0;list-style:none}
.hit li{padding:6px 0;border-top:1px dashed var(--line)}
.hit li a{text-decoration:none}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme: dark){mark{background:#665c1e}}
.back{display:inline-block;margin-bottom:6px;text-decoration:none;font-size:15px}
.hero{display:flex;gap:14px;align-items:flex-start}
.hero .ic{font-size:44px;line-height:1.1}
.secnav{position:sticky;top:62px;z-index:5;background:var(--bg);padding:8px 0;margin:10px -16px 0;padding-left:16px;overflow-x:auto;display:flex;gap:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.quick{background:var(--accent-soft);border-radius:var(--radius);padding:12px 16px;margin-top:14px}
.quick h3{margin:0 0 4px;font-size:16px;color:var(--accent)}
.quick ul{margin:0;padding-left:20px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;scroll-margin-top:120px}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:flex-start}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--accent);transition:transform .15s;display:inline-block;flex:none}
details[open]>summary::before{transform:rotate(90deg)}
details .body{padding:0 16px 14px 36px}
details.note{margin-top:10px;background:transparent}
details.note>summary{font-weight:500;font-size:15px;color:var(--muted);padding:8px 14px}
details .when{color:var(--muted);font-size:15px;margin:0 0 6px}
ol.steps{margin:6px 0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px;border-bottom:1px dashed var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme: dark){ol.steps li::before{color:#0b1715}}
.tips{background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}
.tips b{color:var(--warn)}
.tips ul{margin:2px 0 0;padding-left:20px}
.src{font-size:13px;color:var(--muted);margin-top:8px;word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:4px 0}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.flash td,details.flash{animation:flash 2s ease-out}
@keyframes flash{0%{background:#fde68a}100%{background:transparent}}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.safety li{margin-bottom:4px}
.safety{background:var(--danger-soft);border-radius:var(--radius);padding:10px 16px 10px 34px;margin:0}
.links a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--accent)}
.links .t{font-weight:600}
.links .u{font-size:13px;color:var(--muted);word-break:break-all}
.open-q{background:var(--warn-soft);border-radius:var(--radius);padding:10px 16px 10px 34px;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.tel{font-weight:700;white-space:nowrap}
.btn{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:5px 14px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none}
footer{max-width:960px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
@media print{
  header.top,.secnav,.no-print{display:none!important}
  details{break-inside:avoid}
  body{background:#fff;color:#000;font-size:13px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="#/">🏠 家電說明書</a>
    <div class="search">
      <input id="q" type="search" placeholder="搜尋：家電、功能、錯誤代碼…" autocomplete="off" enterkeyhint="search" aria-label="搜尋">
      <button id="qx" aria-label="清除">✕</button>
    </div>
  </div>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<script src="data.js"></script>
<script>
(function(){
const DATA = (window.APPLIANCES || []);
const BUILD = window.BUILD_INFO || {};
const CATS = ["居家安全","廚房","衛浴","洗衣晾衣","空調","照明","網路與通訊","家具"];
const app = document.getElementById('app');
const qIn = document.getElementById('q');
const qX = document.getElementById('qx');
let catFilter = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const arr = v => Array.isArray(v) ? v : [];
const byId = id => DATA.find(d => d.id === id);
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[\s\-_－—・·]/g, '');
// 把電話號碼變成可以直接點的連結
const telify = html => html.replace(/\(?0\d[\d\-\s\)]{6,14}\d/g, m => {
  const n = m.replace(/\D/g, '');
  return (n.length >= 9 && n.length <= 10) ? '<a class="tel" href="tel:' + n + '">' + m + '</a>' : m; });
// 把來源文字裡的網址變成可點的連結（輸入必須已經 esc 過）
const linkify = html => html.replace(/https?:\/\/[^\s<>"'）)」，、；]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
function hl(text, terms){
  let h = esc(text);
  terms.forEach(t => { if(!t) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    h = h.replace(re, m => '<mark>' + m + '</mark>'); });
  return h;
}

/* ---------- 搜尋 ---------- */
function entriesOf(d){
  const out = [{kind:'item', label:d.name, text:[d.name,d.brand,d.model,d.category,d.summary,arr(d.keywords).join(' ')].join(' ')}];
  arr(d.tutorials).forEach((t,i)=>out.push({kind:'教學', label:t.title, anchor:'t-'+i, text:[t.title,t.when,arr(t.steps).join(' '),arr(t.tips).join(' ')].join(' ')}));
  arr(d.troubleshooting).forEach((t,i)=>out.push({kind:'故障', label:t.symptom, anchor:'p-'+i, text:[t.symptom,t.cause,t.fix].join(' ')}));
  arr(d.error_codes).forEach((t,i)=>out.push({kind:'代碼', label:(t.code||'')+'　'+(t.meaning||''), anchor:'e-'+i, text:[t.code,t.meaning,t.action].join(' ')}));
  arr(d.maintenance).forEach((t,i)=>out.push({kind:'保養', label:t.task, anchor:'m-'+i, text:[t.task,t.frequency,t.how].join(' ')}));
  return out;
}
const INDEX = DATA.map(d => ({d, entries: entriesOf(d).map(e => Object.assign(e, {n: norm(e.text)}))}));

function search(q){
  const terms = q.trim().split(/\s+/).filter(Boolean);
  const nterms = terms.map(norm).filter(Boolean);
  if(!nterms.length) return null;
  const res = [];
  INDEX.forEach(({d, entries}) => {
    const itemText = norm(entries.map(e=>e.text).join(' '));
    if(!nterms.every(t => itemText.includes(t))) return;
    const head = entries[0];
    const subs = entries.slice(1).filter(e => nterms.every(t => e.n.includes(t)) || nterms.every(t => (e.n + head.n).includes(t)) && nterms.some(t => e.n.includes(t)));
    const score = (nterms.every(t => norm(d.name + d.brand + d.model).includes(t)) ? 100 : 0) + subs.length;
    res.push({d, subs, score});
  });
  res.sort((a,b) => b.score - a.score);
  return {terms, res};
}

/* ---------- 首頁 ---------- */
function card(d){
  const n = arr(d.tutorials).length;
  return '<a class="card" href="#/item/' + esc(d.id) + '"><div class="ic">' + esc(d.icon||'📘') + '</div>' +
    '<div class="nm">' + esc(d.name) + '</div><div class="md">' + esc(d.brand) + '　' + esc(d.model) + '</div>' +
    '<div class="ct">' + n + ' 則教學' + (arr(d.error_codes).length ? '・' + arr(d.error_codes).length + ' 個代碼' : '') + '</div></a>';
}
function renderHome(){
  const q = qIn.value;
  const s = search(q);
  let h = '';
  if(s){
    h += '<p class="muted">搜尋「' + esc(q) + '」找到 ' + s.res.length + ' 項家電</p>';
    if(!s.res.length) h += '<div class="empty">找不到。試試別的說法，例如「濾網」「沒反應」「E」「換電池」。</div>';
    s.res.forEach(({d, subs}) => {
      h += '<div class="hit"><a class="hh" href="#/item/' + esc(d.id) + '"><span>' + esc(d.icon||'📘') + '</span><span>' + hl(d.name, s.terms) + '</span></a>' +
        '<div class="md muted small">' + esc(d.brand) + '　' + hl(d.model, s.terms) + '</div>';
      if(subs.length){
        h += '<ul>' + subs.slice(0,8).map(e => '<li><span class="tag">' + esc(e.kind) + '</span><a href="#/item/' + esc(d.id) + '/' + e.anchor + '">' + hl(e.label, s.terms) + '</a></li>').join('') +
          (subs.length > 8 ? '<li class="muted small">還有 ' + (subs.length-8) + ' 筆，點進家電頁查看</li>' : '') + '</ul>';
      }
      h += '</div>';
    });
  } else {
    const cats = CATS.filter(c => DATA.some(d => d.category === c));
    DATA.forEach(d => { if(!cats.includes(d.category)) cats.push(d.category); });
    h += '<h1>我家家電說明書</h1><p class="muted" style="margin-top:0">共 ' + DATA.length + ' 樣家電。上方可直接搜尋功能或錯誤代碼，例如「濾網」「E24」「停電」。</p>';
    h += '<div class="chips"><button class="chip' + (catFilter ? '' : ' on') + '" data-cat="">全部</button>' +
      cats.map(c => '<button class="chip' + (catFilter === c ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>';
    cats.filter(c => !catFilter || c === catFilter).forEach(c => {
      h += '<div class="cat-title">' + esc(c) + '</div><div class="grid">' + DATA.filter(d => d.category === c).map(card).join('') + '</div>';
    });
    const todo = DATA.reduce((n,d) => n + arr(d.open_questions).length, 0);
    if(todo) h += '<p style="margin-top:28px"><a class="btn" href="#/todo">📝 待確認事項（' + todo + '）</a></p>';
  }
  app.innerHTML = h;
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { catFilter = b.dataset.cat || null; renderHome(); });
}

/* ---------- 家電頁 ---------- */
function renderItem(id, anchor){
  const d = byId(id);
  if(!d){ app.innerHTML = '<div class="empty">找不到這個家電。<a href="#/">回首頁</a></div>'; return; }
  const secs = [];
  let h = '<a class="back no-print" href="#/">← 全部家電</a>';
  h += '<div class="hero"><div class="ic">' + esc(d.icon||'📘') + '</div><div><h1>' + esc(d.name) + '</h1>' +
    '<div class="muted">' + esc(d.brand) + '</div><div class="small" style="word-break:break-all">型號：<b>' + esc(d.model) + '</b></div></div></div>' +
    (d.model_note ? '<details class="note"><summary>ℹ️ 型號說明（我家是哪一台？）</summary><div class="body small">' + esc(d.model_note) + '</div></details>' : '');
  if(d.summary) h += '<p>' + esc(d.summary) + '</p>';
  if(arr(d.quick_card).length) h += '<div class="quick"><h3>⚡ 最常用</h3><ul>' + d.quick_card.map(x => '<li>' + telify(esc(x)) + '</li>').join('') + '</ul></div>';

  let body = '';
  if(arr(d.tutorials).length){
    secs.push(['sec-tut','教學']);
    body += '<h2 id="sec-tut">📖 教學</h2>' + d.tutorials.map((t,i) =>
      '<details id="t-' + i + '"><summary>' + esc(t.title) + '</summary><div class="body">' +
      (t.when ? '<p class="when">' + esc(t.when) + '</p>' : '') +
      (arr(t.steps).length ? '<ol class="steps">' + t.steps.map(s => '<li>' + telify(esc(s)) + '</li>').join('') + '</ol>' : '') +
      (arr(t.tips).length ? '<div class="tips"><b>注意</b><ul>' + t.tips.map(s => '<li>' + telify(esc(s)) + '</li>').join('') + '</ul></div>' : '') +
      (t.source ? '<div class="src">來源：' + linkify(esc(t.source)) + '</div>' : '') + '</div></details>').join('');
  }
  if(arr(d.troubleshooting).length){
    secs.push(['sec-trouble','故障排除']);
    body += '<h2 id="sec-trouble">🔧 遇到問題時</h2>' + d.troubleshooting.map((t,i) =>
      '<details id="p-' + i + '"><summary>' + esc(t.symptom) + '</summary><div class="body"><dl class="kv">' +
      (t.cause ? '<dt>可能原因</dt><dd>' + esc(t.cause) + '</dd>' : '') +
      (t.fix ? '<dt>怎麼處理</dt><dd>' + telify(esc(t.fix)) + '</dd>' : '') + '</dl>' +
      (t.source ? '<div class="src">來源：' + linkify(esc(t.source)) + '</div>' : '') + '</div></details>').join('');
  }
  if(arr(d.error_codes).length){
    secs.push(['sec-codes','錯誤代碼']);
    body += '<h2 id="sec-codes">🚨 錯誤代碼</h2><div class="tbl-wrap"><table><thead><tr><th>代碼</th><th>意思</th><th>怎麼處理</th></tr></thead><tbody>' +
      d.error_codes.map((e,i) => '<tr id="e-' + i + '"><td class="code">' + esc(e.code) + '</td><td>' + esc(e.meaning) + '</td><td>' + telify(esc(e.action)) + '</td></tr>').join('') + '</tbody></table></div>';
  }
  if(arr(d.maintenance).length){
    secs.push(['sec-maint','保養']);
    body += '<h2 id="sec-maint">🧽 清潔保養</h2><div class="tbl-wrap"><table><thead><tr><th>項目</th><th>多久一次</th><th>怎麼做</th></tr></thead><tbody>' +
      d.maintenance.map((m,i) => '<tr id="m-' + i + '"><td><b>' + esc(m.task) + '</b></td><td>' + esc(m.frequency) + '</td><td>' + esc(m.how) +
        (m.source ? '<div class="src">來源：' + linkify(esc(m.source)) + '</div>' : '') + '</td></tr>').join('') + '</tbody></table></div>';
  }
  if(arr(d.safety).length){
    secs.push(['sec-safety','安全']);
    body += '<h2 id="sec-safety">⚠️ 安全注意</h2><ul class="safety">' + d.safety.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
  }
  const links = arr(d.manuals).concat(arr(d.videos).map(v => Object.assign({type:'影片'}, v)));
  if(links.length){
    secs.push(['sec-manuals','說明書']);
    body += '<h2 id="sec-manuals">📄 官方說明書與影片</h2><div class="links">' + links.map(m => {
      const u = safeUrl(m.url);
      const inner = '<div class="t">' + (m.type ? '<span class="tag">' + esc(m.type) + '</span>' : '') + esc(m.title || m.url) + '</div>' + (u ? '<div class="u">' + esc(u) + '</div>' : '');
      return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div class="box">' + inner + '</div>';
    }).join('') + '</div>';
  }
  const sp = d.support || {};
  const spRows = [['廠商',sp.company],['電話',sp.phone],['服務時間',sp.service_hours],['保固',sp.warranty]].filter(r => r[1]);
  if(spRows.length || sp.website || sp.register_url){
    secs.push(['sec-support','客服保固']);
    body += '<h2 id="sec-support">☎️ 客服與保固</h2><div class="box"><dl class="kv">' +
      spRows.map(r => '<dt>' + r[0] + '</dt><dd>' + (r[0] === '電話' ? telify(esc(r[1])) : esc(r[1])) + '</dd>').join('') +
      (safeUrl(sp.website) ? '<dt>官網</dt><dd><a href="' + esc(sp.website) + '" target="_blank" rel="noopener">' + esc(sp.website) + '</a></dd>' : '') +
      (safeUrl(sp.register_url) ? '<dt>產品註冊</dt><dd><a href="' + esc(sp.register_url) + '" target="_blank" rel="noopener">' + esc(sp.register_url) + '</a></dd>' : '') +
      '</dl></div>';
  }
  if(arr(d.specs).length){
    secs.push(['sec-specs','規格']);
    body += '<h2 id="sec-specs">📐 規格</h2><div class="box"><dl class="kv">' + d.specs.map(s => '<dt>' + esc(s.label) + '</dt><dd>' + esc(s.value) + '</dd>').join('') + '</dl></div>';
  }
  if(arr(d.open_questions).length){
    secs.push(['sec-todo','待確認']);
    body += '<h2 id="sec-todo">📝 待確認</h2><ul class="open-q">' + d.open_questions.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
  }
  if(arr(d.sources).length){
    body += '<h2 id="sec-src">🔗 資料來源</h2><ul class="small">' + d.sources.map(s => {
      const u = safeUrl(s.url);
      return '<li>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(s.title || u) + '</a>' : esc(s.title)) + '</li>'; }).join('') + '</ul>';
  }
  if(secs.length) h += '<nav class="secnav no-print">' + secs.map(s => '<a class="chip" href="#/item/' + esc(d.id) + '/' + s[0] + '">' + s[1] + '</a>').join('') + '</nav>';
  h += body;
  h += '<p class="no-print" style="margin-top:30px"><button class="btn" id="openAll">全部展開</button> <button class="btn" onclick="window.print()">列印</button></p>';
  app.innerHTML = h;
  document.getElementById('openAll').onclick = e => {
    const all = app.querySelectorAll('details'); const open = e.target.textContent === '全部展開';
    all.forEach(x => x.open = open); e.target.textContent = open ? '全部收合' : '全部展開'; };
  if(anchor){
    const el = document.getElementById(anchor);
    if(el){ if(el.tagName === 'DETAILS') el.open = true;
      setTimeout(() => { el.scrollIntoView({block:'start'}); el.classList.add('flash'); }, 30);
      return; }
  }
  window.scrollTo(0,0);
}

/* ---------- 待確認清單 ---------- */
function renderTodo(){
  let h = '<a class="back" href="#/">← 全部家電</a><h1>📝 待確認事項</h1><p class="muted">資料查不到、或需要你看實機／紙本說明書確認的地方。</p>';
  DATA.filter(d => arr(d.open_questions).length).forEach(d => {
    h += '<h3><a href="#/item/' + esc(d.id) + '">' + esc(d.icon||'') + ' ' + esc(d.name) + '</a></h3><ul class="open-q">' +
      d.open_questions.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
  });
  app.innerHTML = h; window.scrollTo(0,0);
}

function route(){
  const p = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  if(p[0] === 'item' && p[1]){ renderItem(p[1], p[2]); }
  else if(p[0] === 'todo'){ renderTodo(); }
  else { renderHome(); }
}
let t;
qIn.addEventListener('input', () => {
  qX.style.display = qIn.value ? 'block' : 'none';
  clearTimeout(t); t = setTimeout(() => { if(location.hash && location.hash !== '#/') location.hash = '#/'; else renderHome(); }, 120);
});
qIn.addEventListener('keydown', e => { if(e.key === 'Enter') qIn.blur(); });
qX.onclick = () => { qIn.value = ''; qX.style.display = 'none'; renderHome(); qIn.focus(); };
window.addEventListener('hashchange', route);
document.getElementById('foot').innerHTML = '內容整理自各品牌官方說明書與官網，每則都附來源；如與實機不同，以紙本說明書為準。' + (BUILD.date ? '　最後更新：' + esc(BUILD.date) : '');
route();
})();
</script>
</body>
</html>
